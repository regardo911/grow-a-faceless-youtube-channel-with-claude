<!doctype html>
<html><head><meta charset="utf-8"><title>Review</title>
<style>body{font-family:system-ui;background:#111;color:#eee;margin:0;display:flex;gap:24px;padding:24px}
video{height:85vh;background:#000}#side{flex:1;max-width:520px}textarea{width:100%;height:70px;font:16px system-ui}
button{font:16px system-ui;padding:8px 14px;margin:6px 6px 0 0}li{margin:8px 0;cursor:pointer}li b{color:#ffd166}</style></head>
<body>
<video id="v" controls></video>
<div id="side">
  <h2 id="name"></h2>
  <p>Pause where something is wrong, type the note, press <b>Add note</b>. Click a note to jump back to it.</p>
  <textarea id="note" placeholder="e.g. caption covers the Earth here"></textarea><br>
  <button id="add">Add note</button><button id="save">Save notes.json</button>
  <ol id="list"></ol>
</div>
<script>
// open as review.html?video=moon.mp4 ; notes live in this browser until you press Save
const file = new URLSearchParams(location.search).get('video') || 'moon.mp4';
const v = document.getElementById('v'), list = document.getElementById('list'), key = 'notes:' + file;
v.src = file; document.getElementById('name').textContent = file;
let notes = JSON.parse(localStorage.getItem(key) || '[]');
const fmt = s => Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
function draw() { list.innerHTML = ''; notes.sort((a, b) => a.t - b.t).forEach(n => {
  const li = document.createElement('li'); li.innerHTML = `<b>${fmt(n.t)}</b> ${n.text.replace(/</g, '&lt;')}`;
  li.onclick = () => { v.currentTime = n.t; v.pause(); }; list.appendChild(li); });
  localStorage.setItem(key, JSON.stringify(notes)); }
document.getElementById('add').onclick = () => { const text = document.getElementById('note').value.trim();
  if (!text) return; notes.push({ t: Math.round(v.currentTime * 10) / 10, text }); document.getElementById('note').value = ''; draw(); };
document.getElementById('save').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ video: file, notes }, null, 1)], { type: 'application/json' }));
  a.download = 'notes.json'; a.click(); };  // the book's file name; my run had used <video>-notes.json
draw();
</script></body></html>
